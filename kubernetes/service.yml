apiVersion: v1
kind: Service
metadata:
  name: simple-java-app-service
  namespace: demo-ns
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"

spec:
  type: LoadBalancer
  selector:
    app: simple-java-app

  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080

